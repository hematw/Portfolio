local_backend: true

backend:
  name: github
  repo: hematw/Portfolio
  branch: main

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: site
    label: Site
    files:
      - name: general
        label: Brand and footer
        file: src/content/site.json
        fields:
          - { name: brand, label: Brand, widget: string }
          - { name: fullName, label: Full name, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: resume, label: Resume path, widget: string }
          - { name: coffeeUrl, label: Buy me a coffee URL, widget: string }
          - { name: footerImage, label: Footer image, widget: image }
          - name: socials
            label: Social links
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: URL, widget: string }
          - name: navLinks
            label: Quick menu links
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: URL, widget: string }
      - name: hero
        label: Hero
        file: src/content/hero.json
        fields:
          - { name: firstName, label: First name, widget: string }
          - { name: lastName, label: Last name, widget: string }
          - { name: tagline, label: Tagline, widget: text }
          - { name: image, label: Image, widget: image }
          - name: primaryCta
            label: Primary button
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: URL, widget: string }
          - name: secondaryCta
            label: Secondary button
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: URL, widget: string }
      - name: about
        label: About
        file: src/content/about.json
        fields:
          - { name: title, label: Title, widget: string }
          - { name: body, label: Body, widget: text }
          - { name: image, label: Image, widget: image }
          - name: skills
            label: Skills
            widget: list
          - name: stats
            label: Stats
            widget: list
            fields:
              - { name: value, label: Value, widget: string }
              - { name: label, label: Label, widget: string }
      - name: experience
        label: Experience
        file: src/content/experience.json
        fields:
          - { name: title, label: Title, widget: string }
          - name: jobs
            label: Jobs
            widget: list
            summary: "{{company}} - {{role}}"
            fields:
              - { name: company, label: Company, widget: string }
              - { name: role, label: Role, widget: string }
              - { name: dates, label: Dates, widget: string }
              - { name: summary, label: Summary, widget: text }
              - { name: linkLabel, label: Link label, widget: string, required: false }
              - { name: linkHref, label: Link URL, widget: string, required: false }
              - name: tags
                label: Tags
                widget: list
                field: { name: tag, label: Tag, widget: string }
      - name: projects
        label: Projects
        file: src/content/projects.json
        fields:
          - { name: title, label: Title, widget: string }
          - name: items
            label: Projects
            widget: list
            summary: "{{title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: href, label: URL, widget: string }
              - { name: image, label: Image, widget: image, required: false }
              - { name: featured, label: Featured wide card, widget: boolean, default: false }
              - name: theme
                label: Glow theme
                widget: select
                required: false
                options:
                  - { label: None, value: "" }
                  - { label: Pink, value: "pink" }
                  - { label: Amber, value: "amber" }
              - name: tags
                label: Tags
                widget: list
                field: { name: tag, label: Tag, widget: string }
      - name: services
        label: Services
        file: src/content/services.json
        fields:
          - { name: title, label: Title, widget: string }
          - name: items
            label: Services
            widget: list
